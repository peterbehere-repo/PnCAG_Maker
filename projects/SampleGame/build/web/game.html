<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SampleGame</title></head>
<body><p>Resolving latest build…</p>
<script>
fetch('builds.json', {cache: 'no-store'})
  .then(r => r.json())
  .then(j => { window.location.replace('game-' + j.build + '.html'); })
  .catch(() => { document.body.innerHTML = '<p>Failed to resolve build. Try the <a href="index.html">index</a>.</p>'; });
</script></body></html>
