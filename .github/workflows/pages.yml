name: Deploy Web Builds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build pages content
        run: |
          rm -rf _site && mkdir -p _site
          for d in projects/*/build/web; do
            game=$(basename $(dirname $(dirname $d)))
            mkdir -p "_site/$game"
            cp -r "$d/." "_site/$game/"
            # redirect index.html -> newest versioned html
            newest=$(ls -1 "$d"/game-*.html 2>/dev/null | sort -V | tail -1)
            if [ -n "$newest" ]; then
              bn=$(basename "$newest")
              cat > "_site/$game/index.html" << EOF
<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./$bn"><link rel="canonical" href="./$bn"></head><body><a href="./$bn">Open game ($bn)</a></body></html>
EOF
            fi
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
