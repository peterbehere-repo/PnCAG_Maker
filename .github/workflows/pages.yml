name: Deploy Web Builds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble web builds from each project
        run: |
          set -e
          mkdir -p /tmp/ghpages
          # For every project that has a web export, copy its build/web to /tmp/ghpages/<project>
          for proj in projects/*/; do
            name="$(basename "$proj")"
            if [ -d "$proj/build/web" ]; then
              echo "packing $name"
              cp -r "$proj/build/web" "/tmp/ghpages/$name"
            fi
          done
          ls -la /tmp/ghpages

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/ghpages
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable Pages (if needed)
        run: |
          gh api -X POST repos/${{ github.repository }}/pages \
            -f "source[branch]=gh-pages" -f "source[path]=/" \
            --silent || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
