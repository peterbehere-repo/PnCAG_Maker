name: Deploy Web Builds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble web builds from each project
        run: |
          set -e
          rm -rf /tmp/ghpages
          mkdir -p /tmp/ghpages
          # For every project that has a web export, copy its build/web to /tmp/ghpages/<project>
          for proj in projects/*/; do
            name="$(basename "$proj")"
            if [ -d "$proj/build/web" ]; then
              echo "packing $name"
              mkdir -p "/tmp/ghpages/$name"
              cp "$proj/build/web"/game-* "/tmp/ghpages/$name/" 2>/dev/null || true
              # stable entry point: game.html fetches builds.json (no-cache) and redirects to newest
              cp "$proj/build/web/game.html" "/tmp/ghpages/$name/game.html" 2>/dev/null || true
              newest_id="$(ls -1 "$proj/build/web"/game-*.html 2>/dev/null | sort -V | tail -1 | sed 's/.*game-\([0-9]*\)\.html/\1/' || true)"
              printf '{"build": "%s"}\n' "$newest_id" > "/tmp/ghpages/$name/builds.json"
              # also copy any index.* companion files (icons, worklets) except .import
              for f in "$proj/build/web"/index.*; do
                [ -e "$f" ] || continue
                case "$(basename "$f")" in *.import) continue;; esac
                cp "$f" "/tmp/ghpages/$name/"
              done
              # index.html -> stable game.html (which resolves newest via builds.json)
              printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./game.html"></head><body><a href="./game.html">Open game</a></body></html>\n' > "/tmp/ghpages/$name/index.html" 
            fi
          done
          ls -la /tmp/ghpages

          # root entry -> default project's stable game.html
          if [ -f /tmp/ghpages/SampleGame/game.html ]; then
            printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./SampleGame/game.html"></head><body><a href="./SampleGame/game.html">Open game</a></body></html>\n' > /tmp/ghpages/index.html
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/ghpages
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable Pages (if needed)
        run: |
          gh api -X POST repos/${{ github.repository }}/pages \
            -f "source[branch]=gh-pages" -f "source[path]=/" \
            --silent || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
